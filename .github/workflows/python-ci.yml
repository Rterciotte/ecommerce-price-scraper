name: Python CI

# ======================================
# TRIGGERS
# ======================================

on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main


# ======================================
# JOBS
# ======================================

jobs:

  test:

    runs-on: ubuntu-latest
        
    env:
      PYTHONPATH: .

    steps:

      # ======================================
      # CLONE REPOSITORY
      # ======================================

      - name: Checkout repository

        uses: actions/checkout@v4

      # ======================================
      # SETUP PYTHON
      # ======================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.13"

      # ======================================
      # INSTALL DEPENDENCIES
      # ======================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pytest

      # ======================================
      # RUN TESTS
      # ======================================

      - name: Run tests

        run: |

          pytest